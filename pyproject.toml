[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spect-program"
version = "0.0.0"
description = "Hybrid CNNs for brain SPECT. Research use only."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# CPU build: pip install torch --index-url https://download.pytorch.org/whl/cpu
hybrid = ["torch>=2.0"]

# Packages live under src/spect/ rather than src/ directly. A package named
# `io` at the top level would shadow the standard library module of the same
# name, which fails in ways that are slow to diagnose.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
